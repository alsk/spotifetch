name: Update Spotify Top Tracks

on:
    schedule:
      - cron: '0 6 * * *'
    workflow_dispatch:

jobs:
    update:
      runs-on: ubuntu-latest
      permissions:
        contents: write
      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-node@v4
          with:
            node-version: '24'

        - name: Fetch top tracks
          env:
            SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
            SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
            SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          run: |
            mkdir -p public
            node .github/scripts/update-spotify.mjs

        - name: Commit if changed
          run: |
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add public/spotify-top.json public/spotify-recent.json
            git diff --staged --quiet || (git commit -m 'chore: update spotify data' && git push)
